<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
    <main>
        <section class="card">
            <img class="imagem" src="./images/image-product-desktop.jpg" alt="perfume Gabrielle Essence">
            <div class="conteudo">
                <p class="tag">Perfume</p>

                <h1 class="titulo">Gabrielle Essence Eau De Parfum</h1>

                <p class="texto">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
                Perfumer-Creator for the House of CHANEL.</p>
                <div class="precos">
                    <p class="promo">$149.99</p>
                    <p class="valor">$169.99</p>
                </div>
                <button class="botao">
                    <img src="./images/icon-cart.svg" alt="add to cart">
                    Add to Cart
                </button>
            </div>
        </section>
    </main>
    <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/luanarb" target="_blank" rel="noopener noreferrer">Luana</a>.
  </footer>
</body>
</html>
